<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">Brightin Star product thumbnail placeholder</title>
  <desc id="desc">A neutral placeholder thumbnail for catalog products without public images.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect width="640" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="320" cy="205" r="92" fill="none" stroke="#93c5fd" stroke-width="18"/>
  <circle cx="320" cy="205" r="48" fill="none" stroke="#dbeafe" stroke-width="10"/>
  <circle cx="352" cy="172" r="12" fill="#bfdbfe"/>
  <text x="320" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Brightin Star</text>
  <text x="320" y="374" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#bfdbfe">Product Image Coming Soon</text>
</svg>
